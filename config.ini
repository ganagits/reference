; =====================================================================
;  BSSV Monitor - master configuration
;  Every path may be absolute, or relative to the folder holding this file.
;  Lines starting with ';' are comments.
; =====================================================================

[general]
; How often a full pass over all enabled servers is executed.
; Only used when the script runs in loop mode (the default).
run_interval_seconds = 300

; loop  = the script stays resident and repeats forever (use with NSSM / a
;         startup shortcut). "once" = single pass then exit (use with Windows
;         Task Scheduler). Command line --once / --loop overrides this.
run_mode = loop

; If a pass takes longer than run_interval_seconds, skip the missed tick
; instead of running back-to-back passes.
skip_missed_ticks = true

; Excel workbook holding the server list, and the sheet inside it.
excel_config = servers.xlsx
excel_sheet = Servers

; Folder that relative PayloadPath values in the Excel are resolved against.
payload_dir = payloads

; How many servers to probe in parallel. 1 = strictly sequential.
max_workers = 4


[request]
; Per-request timeout in seconds (Excel column TimeoutSeconds overrides this).
timeout_seconds = 30

; Extra attempts after the first failure, and the pause between them.
; A check is only marked FAILED after all attempts fail.
retries = 1
retry_delay_seconds = 5

; TLS verification. BSSV servers usually carry an internal CA certificate.
;   verify_ssl = true  + ca_bundle = C:\certs\internal-ca.pem   (recommended)
;   verify_ssl = false                                          (skips checks)
verify_ssl = false
ca_bundle =

; Default SOAPAction header. BSSV normally uses an empty SOAPAction ("").
; The Excel column SOAPAction overrides this per row.
default_soap_action = ""

content_type = text/xml; charset=utf-8
user_agent = BSSV-Monitor/1.0

; Optional HTTP proxy. Leave blank for a direct connection.
http_proxy =
https_proxy =


[logging]
; Rolling result log. Both .csv and .xlsx are accepted; .csv is recommended
; because it is append-friendly and opens fine in Excel.
result_log = logs\bssv_monitor_log.csv

; AUTOPURGE - rows older than this many hours are removed from result_log
; after every pass, so the file never grows without bound.
retention_hours = 72

; Move purged rows into a monthly archive file instead of deleting them.
archive_purged = true
archive_dir = logs\archive

; Application/diagnostic log (rotating).
app_log = logs\bssv_monitor.log
app_log_level = INFO
app_log_max_bytes = 5242880
app_log_backup_count = 5

; Keep the raw response body of failed checks for troubleshooting.
save_failed_responses = true
failed_response_dir = logs\responses
failed_response_retention_hours = 72


[dashboard]
enabled = true

; Where the dashboard is hosted. Point this at your IIS site folder or your
; XAMPP htdocs folder. It is created if it does not exist.
;   IIS   : C:\inetpub\wwwroot\bssv-monitor
;   XAMPP : C:\xampp\htdocs\bssv-monitor
web_root = C:\inetpub\wwwroot\bssv-monitor

; Name of the JSON feed written into web_root after every pass.
json_file_name = status.json

; Rolling window shown on the dashboard.
window_hours = 72

; Copy dashboard\index.html into web_root on every pass, so an updated
; dashboard is published automatically. Set to false once you are live and
; do not want the hosted copy overwritten.
copy_dashboard_files = true

; Maximum number of individual checks embedded in status.json (newest first).
; The rolling counters and the chart always cover the full window; this only
; caps the detail table. Lower it if the JSON feed gets large (roughly 350 KB
; per 1000 rows) - browsers reload it every 60 seconds.
max_detail_rows = 1500


[email]
; Alerts are sent ONLY on failure. Successes are logged, never mailed.
enabled = true

; PowerShell script used to send the mail (Send-MailMessage, no credentials).
powershell_script = send_alert.ps1
powershell_exe = powershell.exe

smtp_server = smtp.yourcompany.com
smtp_port = 25
use_ssl = false

from_address = bssv-monitor@yourcompany.com

; Default recipients, comma separated. Used when neither the Excel
; AlertEmailTo cell nor an [email.recipients] entry applies.
to_addresses = jde-support@yourcompany.com
cc_addresses =

subject_prefix = [BSSV ALERT]

; Do not send another alert for the same server+service within this many
; minutes, however many times it keeps failing. 0 = alert every single time.
throttle_minutes = 30

; Send one consolidated mail per pass instead of one mail per failed server.
consolidate = true

; With consolidate = true, send a SEPARATE mail per environment, so a PROD
; outage stays in its own thread and can carry its own Outlook rule / DL.
; Set to false to receive one mail covering every environment at once.
group_by_environment = true

; Attach the failed response body (when save_failed_responses is on).
attach_response = true

; Send a one-off "RECOVERED" mail the first time a server succeeds again
; after having alerted. Off by default - successes are silent.
send_recovery = false


[email.recipients]
; Per-ENVIRONMENT alert routing. The key is the Environment value used in
; servers.xlsx (case-insensitive); the value is a comma separated address list.
; Not every environment needs an entry - anything missing falls back to
; [email] to_addresses.
;
; Recipient precedence, highest first:
;   1. the AlertEmailTo cell on the Excel row
;   2. the matching entry below
;   3. [email] to_addresses
;
; Uncomment and edit the lines you need:
; PROD      = ops-oncall@yourcompany.com, jde-support@yourcompany.com
; PRE-PROD  = jde-support@yourcompany.com
; UAT       = jde-test-team@yourcompany.com
; TEST      = jde-test-team@yourcompany.com
; DEV       = jde-dev-team@yourcompany.com
; DR        = infra-team@yourcompany.com
; TRAINING  = jde-training@yourcompany.com
